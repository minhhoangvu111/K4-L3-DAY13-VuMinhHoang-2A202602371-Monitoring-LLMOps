service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >-
    Mục tiêu là ít nhất 99.5% request nhận response thành công trong 3 giây trên cửa sổ 28 ngày.
    Error budget là 100% - 99.5% = 0.5% tổng request; với 10,000 request tương đương tối đa
    50 request không đạt. Latency 3 giây cũng là ngưỡng cảnh báo symptom-based.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
